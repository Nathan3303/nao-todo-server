# 服务端门禁（T202）：build/vet/unit + 真实 MySQL/Redis 集成测试
# 约定：Go 1.27（与本地一致）
# T205：新增 golangci-lint v2.14.0（与本地同版本，官方二进制由 go1.27.0 构建）；初版 **report-only**。
# T206：存量 124 条（lll 56 / goimports 53 / staticcheck 10 / govet 2 / prealloc 2 / gosec 1）分 3 批清零后，
#       **已摘掉 continue-on-error ⇒ 全量阻断**（lint 发现即 build/vet/unit 红、挡住合并）。
#       原先的 errcheck 专项步骤已删除（纯冗余）：全量步骤读同一 .golangci.yml，
#       已含 errcheck（check-type-assertions: true / check-blank: false），且同样阻断。
# 集成测试口径固定 -p 1：多个包的 TestMain 会各自 AutoMigrate 同一测试库，并行必竞态
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一 ref 的旧运行自动取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  build:
    name: build/vet/unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./... -count=1
      # 放在最后：即使格式债未清，build/vet/unit 的证据也已产出
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下 Go 文件未通过 gofmt（.editorconfig 要求缩进用 tab）："
            echo "$unformatted"
            exit 1
          fi
      # T206：存量已清零 ⇒ **全量阻断**（无 continue-on-error）。lint 失败 = 本作业红 = 挡住合并。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 与本地实测版本一致（v2.14.0，built with go1.27.0）
          version: v2.14.0
          # 保留 v1 配置里的 run.timeout: 5m 意图（v2 schema 已移除该字段）
          args: --timeout=5m

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: dev_password
          MYSQL_DATABASE: nao_todo_test
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdev_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NAO_TEST_MYSQL_DSN: root:dev_password@tcp(127.0.0.1:3306)/nao_todo_test?parseTime=true&loc=UTC&charset=utf8mb4
      NAO_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: integration tests
        run: go test -tags integration -p 1 -count=1 ./...
