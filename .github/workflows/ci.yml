# 服务端门禁（T202）：build/vet/unit + 真实 MySQL/Redis 集成测试
# 约定：Go 1.27（与本地一致）
# T205：新增 golangci-lint v2.14.0（与本地同版本，官方二进制由 go1.27.0 构建）。
#       老仓首次全量跑有 124 条存量发现（按 linter 分组见 T205 回执），故先 **report-only**：
#       该步骤 continue-on-error，只输出结果、不阻断；build/vet/unit 与 integration 仍是唯一的必需检查。
#       存量清扫单落地后，再去掉 continue-on-error（或改为 only-new-issues）转为阻断。
#       另加 **errcheck 独立阻断步骤**（--enable-only=errcheck）：本项目配置下实测 0 条 ⇒ 不阻断存量，
#       但今后 db.*/tx/repo.* 或类型断言漏判错会直接红。
# 集成测试口径固定 -p 1：多个包的 TestMain 会各自 AutoMigrate 同一测试库，并行必竞态
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一 ref 的旧运行自动取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  build:
    name: build/vet/unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./... -count=1
      # 放在最后：即使格式债未清，build/vet/unit 的证据也已产出
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下 Go 文件未通过 gofmt（.editorconfig 要求缩进用 tab）："
            echo "$unformatted"
            exit 1
          fi
      # T205：report-only（非阻断）。continue-on-error 保证存量 lint 发现不会把
      # build/vet/unit 这个必需检查变红；发现数仍完整打印在日志里。
      - name: golangci-lint (report-only)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          # 与本地实测版本一致（v2.14.0，built with go1.27.0）
          version: v2.14.0
          # 保留 v1 配置里的 run.timeout: 5m 意图（v2 schema 已移除该字段）
          args: --timeout=5m
      # T205：errcheck 独立阻断步骤（缺省即阻断，无 continue-on-error）。
      # --enable-only=errcheck 只启用 errcheck，其余 linter/enable 集被覆写；
      # linters.settings.errcheck（check-type-assertions: true / check-blank: false）与
      # exclusions/presets（含 std-error-handling，即 defer Close() 等暂不管）继续生效。
      # 当前树实测 0 条 ⇒ CI 绿；一旦漏判错，本步骤 rc=1，build/vet/unit 直接红并挡住合并。
      - name: errcheck (blocking)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --enable-only=errcheck --timeout=5m

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: dev_password
          MYSQL_DATABASE: nao_todo_test
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdev_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NAO_TEST_MYSQL_DSN: root:dev_password@tcp(127.0.0.1:3306)/nao_todo_test?parseTime=true&loc=UTC&charset=utf8mb4
      NAO_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: integration tests
        run: go test -tags integration -p 1 -count=1 ./...
