server:
    ip:
    port: 3302
    version: 1.0
    jwtSecret: jwt@naotodo-test.secret
    goMaxProc: 2
    certFile: /app/ssl/server.crt
    keyFile: /app/ssl/server.key
    debug: true

mysql:
    host: localhost
    port: 3306
    database: naotodo
    username: root
    password: naotodo-test@mysql.pass
    charset: utf8mb4
    parseTime: True
    loc: Local

redis:
    host: localhost
    port: 6379
    password: naotodo-test@redis.pass
    database: 0
    network: tcp

log:
    level: info
    filePath: logs/app.log
    maxSize: 100
    maxAge: 30
    maxBackups: 10
    compress: true
    outputConsole: true

uploads:
    uploadDir: uploads
    avatarDir: avatars
    maxFileSize: 2097152
    staticPath: /static/uploads
    serverURL: "http://localhost:3302"

reminder:
    # 提醒 cron 字段改写开关（nao-todo-server#54 / T528）。
    # false（默认）= 停用：提醒判定下移到客户端，服务端不再清空一次性 remind_at、
    #                不再推进重复提醒（同时跳过 /sse/reminders 事件推送），保留到期痕迹以支持补弹。
    # true = 回滚到旧行为：cron 每分钟扫描到期提醒并改写字段 + 推送 /sse/reminders。
    cronFieldWriteBack: false
