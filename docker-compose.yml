services:
    mysql:
        image: mysql:8.4.9
        container_name: naotodo-mysql
        ports:
            - "3306:${MYSQL_PORT}"
        volumes:
            - mysql-data:/var/lib/mysql
            - /opt/nao-todo-server/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
            - /opt/nao-todo-server/mysql/conf/client.cnf:/etc/mysql/client.cnf:ro
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - TZ=Asia/Shanghai
        networks:
            - naotodo-backend
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${MYSQL_ROOT_PASSWORD}",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    redis:
        image: redis:8.8.0
        container_name: naotodo-redis
        ports:
            - "6379:${REDIS_PORT}"
        volumes:
            - redis-data:/data
            - /opt/nao-todo-server/redis/conf/redis.conf:/etc/redis/redis.conf:ro
        environment:
            - TZ=Asia/Shanghai
        networks:
            - naotodo-backend
        command: redis-server /etc/redis/redis.conf --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: naotodo-server
        ports:
            - "3302:3302"
        volumes:
            - app-uploads-data:/app/uploads
            - app-logs-data:/app/logs
        environment:
            - MYSQL_HOST=mysql
            - MYSQL_PORT=${MYSQL_PORT}
            - MYSQL_USER=root
            - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - REDIS_HOST=redis
            - REDIS_PORT=${REDIS_PORT}
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_DB=${REDIS_DB}
            - JWT_SECRET=${JWT_SECRET}
            - TZ=Asia/Shanghai
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - naotodo-backend
        restart: unless-stopped

volumes:
    mysql-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /opt/nao-todo-server/mysql/data
    redis-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /opt/nao-todo-server/redis/data
    app-uploads-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /opt/nao-todo-server/app/uploads
    app-logs-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /opt/nao-todo-server/app/logs

networks:
    naotodo-backend:
        driver: bridge
