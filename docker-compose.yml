services:
    mysql:
        image: mysql:8.4.9
        container_name: naotodo-mysql
        ports:
            - "3306:${MYSQL_PORT}"
        volumes:
            - mysql-data:/var/lib/mysql
            - /opt/nao-todo-server/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
            - /opt/nao-todo-server/mysql/conf/client.cnf:/etc/mysql/client.cnf:ro
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - TZ=Asia/Shanghai
        mem_limit: 512m
        memswap_limit: 512m # 数据库禁用 swap，保证性能一致性
        cpus: 0.75
        networks:
            - naotodo-backend
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${MYSQL_ROOT_PASSWORD}",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    redis:
        image: redis:8.8.0
        container_name: naotodo-redis
        ports:
            - "6379:${REDIS_PORT}"
        volumes:
            - redis-data:/data
            - /opt/nao-todo-server/redis/conf/redis.conf:/etc/redis/redis.conf:ro
        environment:
            - TZ=Asia/Shanghai
        command: redis-server /etc/redis/redis.conf --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
        mem_limit: 128m
        memswap_limit: 128m # 禁用 swap
        cpus: 0.25
        networks:
            - naotodo-backend
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: naotodo-server
        ports:
            - "3302:3302"
        volumes:
            - app-uploads-data:/app/uploads
            - app-logs-data:/app/logs
        environment:
            - MYSQL_HOST=mysql
            - MYSQL_PORT=${MYSQL_PORT}
            - MYSQL_USER=root
            - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - REDIS_HOST=redis
            - REDIS_PORT=${REDIS_PORT}
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_DB=${REDIS_DB}
            - JWT_SECRET=${JWT_SECRET}
            - TZ=Asia/Shanghai
            - GOMAXPROCS=1
            - GOMEMLIMIT=400MiB # Go 1.19+ 的内存软限制，防止 OOM
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        mem_limit: 256m
        memswap_limit: 256m # 禁用 swap，避免性能抖动
        cpus: 0.75
        networks:
            - naotodo-backend
        restart: unless-stopped

    nginx:
        image: nginx:stable-alpine
        container_name: naotodo-nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /opt/nao-todo-server/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
            - /opt/nao-todo-server/nginx/ssl:/etc/nginx/ssl:ro
            - /opt/nao-todo-server/nginx/logs:/var/log/nginx
        depends_on:
            - app
        mem_limit: 64m
        memswap_limit: 64m
        cpus: 0.25
        networks:
            - naotodo-backend
        restart: unless-stopped

volumes:
    mysql-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /opt/nao-todo-server/mysql/data
    redis-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /opt/nao-todo-server/redis/data
    app-uploads-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /opt/nao-todo-server/app/uploads
    app-logs-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /opt/nao-todo-server/app/logs

networks:
    naotodo-backend:
        driver: bridge
