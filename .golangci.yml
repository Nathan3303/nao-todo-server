# 运行配置
run:
    # 并发数，默认是 CPU 核心数
    concurrency: 4
    # 分析超时时间
    timeout: 5m
    # 检查测试文件
    tests: true

# 输出格式配置
output:
    # 输出格式：tab, colored-line-number, line-number, json, checkstyle, code-climate
    format: colored-line-number
    # 打印出有问题的代码行
    print-issued-lines: true
    # 打印出 linter 的名称
    print-linter-name: true

# Linter 配置
linters:
    disable-all: true # 禁用所有默认 linter，按需开启
    enable:
        # --- 核心与官方规范 ---
        - gofmt # 检查代码是否通过 gofmt 格式化
        - goimports # 检查 import 分组与排序
        - govet # Go 官方静态分析工具，检查可疑代码
        - staticcheck # 官方推荐的综合静态检查工具
        - errcheck # 检查是否忽略了错误返回值 (Go 核心规范)
        - gosimple # 检查代码是否可以简化
        - unused # 检查未使用的常量、变量、函数等

        # --- 团队风格与可读性 ---
        - lll # 行宽检查 (Line Length Limit)
        - revive # 替代已废弃的 golint，更强大的代码规范检查
        - unparam # 检查未使用的函数参数
        - whitespace # 检查不必要的空行

        # --- 性能与 Bug 预防 ---
        - gocritic # 提供多种代码优化和 Bug 预防建议
        - gosec # 检查常见的安全问题 (如硬编码密码、SQL注入风险)
        - prealloc # 检查切片预分配，提升性能

# 各个 Linter 的具体参数配置
linters-settings:
    # 行宽限制配置
    lll:
        line-length: 100 # 最大行宽 100 字符
        tab-width: 4 # Tab 占 4 个字符宽度

    # revive 配置 (替代 golint)
    revive:
        rules:
            - name: exported
              arguments:
                  - "disableStutteringCheck" # 禁用函数名与包名重复的检查

    # errcheck 配置
    errcheck:
        check-type-assertions: true # 检查类型断言是否处理了 error
        check-blank: false # 允许使用 _ = func() 显式忽略错误

    # goimports 配置
    goimports:
        local-prefixes: "github.com/Nathan3303/nao-todo-server" # 替换为你的项目路径，用于 import 分组

# 排除特定规则或文件的报错
issues:
    exclude-rules:
        # 允许在测试文件中忽略 errcheck 和行宽限制
        - path: _test\.go
          linters:
              - errcheck
              - lll

        # 允许在 main.go 或 cmd 目录中忽略未导出变量的警告
        - path: cmd/
          linters:
              - revive
